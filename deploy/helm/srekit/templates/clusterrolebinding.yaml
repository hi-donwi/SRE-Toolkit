{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "srekit.fullname" . }}-viewer-binding
  labels:
    {{- include "srekit.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ default (include "srekit.fullname" .) .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "srekit.fullname" . }}-viewer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
